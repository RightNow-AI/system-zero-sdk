[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rightnow-system-zero"
version = "0.3.0"
description = "System Zero API client with typed decisions and client-side workflows."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28.1,<0.29", "httpcore>=1.0.9,<2", "websockets>=15.0.1,<16"]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Operating System :: OS Independent",
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

authors = [{name = "RightNow AI, Inc."}]
keywords = ["system-zero", "api", "decisions"]

[project.urls]
Changelog = "https://github.com/RightNow-AI/system-zero-sdk/blob/main/CHANGELOG.md"
Source = "https://github.com/RightNow-AI/system-zero-sdk"
Issues = "https://github.com/RightNow-AI/system-zero-sdk/issues"
Homepage = "https://github.com/RightNow-AI/system-zero-sdk"
Documentation = "https://github.com/RightNow-AI/system-zero-sdk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed", "tool-schemas.json", "error-catalog.json", "argument-limits.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"
