[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rightnow-system-zero"
version = "0.1.0"
description = "System Zero API client with typed decisions and client-side workflows."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28.1,<0.29", "httpcore>=1.0.9,<2"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/RightNow-AI/system-zero-sdk"
Documentation = "https://github.com/RightNow-AI/system-zero-sdk"
Source = "https://github.com/RightNow-AI/system-zero-sdk"
Issues = "https://github.com/RightNow-AI/system-zero-sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed", "tool-schemas.json", "error-catalog.json", "argument-limits.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"
